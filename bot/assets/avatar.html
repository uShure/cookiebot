<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; width: 640px; height: 640px; overflow: hidden; }
  body {
    display: grid;
    place-items: center;
    background:
      radial-gradient(rgba(11, 31, 58, 0.09) 2px, transparent 2.6px) 0 0 / 34px 34px,
      radial-gradient(circle at 30% 22%, #f2fbff 0, #d8f1ff 46%, #9fdcff 100%);
  }
  .stage { position: relative; width: 440px; height: 440px; }
  .bubble {
    position: absolute;
    inset: 36px 26px 70px 30px;
    border: 16px solid #0b1f3a;
    border-radius: 120px;
    background: #fff4d4;
    box-shadow: 22px 24px 0 #0b1f3a;
  }
  .tail {
    position: absolute;
    left: 58px;
    bottom: 26px;
    width: 104px;
    height: 104px;
  }
  .cookie {
    position: absolute;
    left: 94px;
    top: 74px;
    width: 250px;
    height: 250px;
    transform: rotate(-12deg);
  }
</style>
</head>
<body>
  <div class="stage">
    <svg class="tail" viewBox="0 0 100 100" aria-hidden="true">
      <path d="M92 6 L20 96 L50 8 Z" fill="#fff4d4" stroke="#0b1f3a" stroke-width="15" stroke-linejoin="round" />
    </svg>

</html>
