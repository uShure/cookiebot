services:
  cookiebot:
    build: .
    container_name: cookiebot
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/cookiebot.db
    volumes:
      - ./data:/app/data
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
